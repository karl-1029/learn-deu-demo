spring:
  config:
    import: optional:nacos:gateway.yaml
  application:
    name: gateway
  reactor:
    context-propagation: auto   # WebFlux 下自动传播 ThreadLocal（含 MDC traceId）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true          # 开启从注册中心动态创建路由的功能
          lower-case-service-id: true
      routes:
        # 用户服务路由
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
            - RouteId=X-Trace-Id,traceId

        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0


