spring:
  application:
    name: gateway
  reactor:
    context-propagation: auto   # WebFlux 下自动传播 ThreadLocal（含 MDC traceId）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        # 用户服务路由
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
            - OrderRouteId=X-key,X-value

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0


