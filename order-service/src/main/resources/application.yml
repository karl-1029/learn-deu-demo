spring:
  config:
    import: optional:nacos:127.0.0.1:8848
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719

server:
  port: 8082
