spring:
  config:
    import: optional:nacos:order-service.yaml
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
        server-addr: 127.0.0.1:8848
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      datasource:
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: ${spring.application.name}-sentinel-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow


# Nacos 配置中心示例 - 本地配置（用于测试优先级）
order-service:
  config:
    appName: "订单服务-from-local"
    env: "local环境-form-dev"
    description: "描述-from-local"



server:
  port: 8082

management:
  tracing:
    sampling:
      probability: 1.0

